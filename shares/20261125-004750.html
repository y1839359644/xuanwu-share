<style>
:root{--bg:#f6f7f9;--card:#fff;--line:#e8eaef;--tx:#111827;--tx2:#6b7280;--warn:#b45309;--ok:#0f766e;--accent:#2563eb}
@media (prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#171a21;--line:#262b35;--tx:#e5e7eb;--tx2:#9aa3af}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 "Microsoft YaHei",system-ui,sans-serif}
header{padding:18px 20px 10px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
h1{font-size:18px;margin:0}
.sub{color:var(--tx2);font-size:12px}
.dot{width:8px;height:8px;border-radius:50%;background:#22c55e;display:inline-block;margin-right:6px}
.dot.off{background:#ef4444}
main{padding:0 20px 28px;max-width:1400px;margin:0 auto}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin:12px 0 18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.card .k{color:var(--tx2);font-size:12px}
.card .v{font-size:24px;font-weight:700;margin-top:4px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:18px}
.panel h2{font-size:15px;margin:0;padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.tools{display:flex;gap:8px;align-items:center;color:var(--tx2);font-size:12px}
select,button,input{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
table{width:100%;border-collapse:collapse}
th,td{padding:10px 14px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--tx2);font-weight:600;font-size:12px}
tbody tr:nth-child(even){background:rgba(127,127,127,.04)}
td.num,th.num{text-align:right}
.wu{color:var(--warn);font-weight:700}
.avg{color:var(--ok);font-weight:700}
.tag{display:inline-block;padding:1px 8px;border-radius:999px;background:rgba(37,99,235,.1);color:var(--accent);font-size:12px}
.scroll{max-height:70vh;overflow:auto}
.empty{padding:28px;text-align:center;color:var(--tx2)}
footer{color:var(--tx2);font-size:12px;text-align:center;padding:8px 0 24px}
.banner{padding:0 20px 6px;max-width:1400px;margin:0 auto}
.bwrap{display:flex;gap:18px;align-items:center;justify-content:space-between;background:var(--card);
  border:1px solid var(--line);border-radius:12px;padding:14px 18px;flex-wrap:wrap}
.btitle{font-weight:700;margin-bottom:4px}
.url{font-family:Consolas,monospace;font-size:19px;color:var(--accent);letter-spacing:.3px;word-break:break-all}
.tip{color:var(--tx2);font-size:12px;margin-top:6px}
.qr{width:116px;height:116px;background:#fff;padding:6px;border-radius:10px;border:1px solid var(--line)}
.btn{display:inline-block;padding:6px 12px;border:1px solid var(--line);border-radius:8px;color:var(--accent);
  text-decoration:none;font-size:13px;background:var(--card);cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
.chip{border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:13px;cursor:pointer;user-select:none}
.chip .n{color:var(--tx2);margin-left:6px;font-size:12px}
.chip.on{background:rgba(37,99,235,.12);border-color:var(--accent);color:var(--accent)}
.chip.on .n{color:var(--accent)}
.search{width:200px}
.wq{width:62px;padding:3px 6px;font-size:13px;margin:0 6px}
.settings{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px 22px;padding:14px 16px}
.settings label{display:flex;align-items:center;font-size:13px;color:var(--tx)}
.settings label b{width:88px;font-weight:600}
.settings label span{color:var(--tx2);font-size:12px;margin-left:8px}
.sethint{padding:0 16px 14px;color:var(--tx2);font-size:12px}
</style></head>

<header>
  <h1>宣武团助手 · 数据看板</h1>

    </tr></thead><tbody></tbody></table></div>
  </div>
</main>

<script>
var DATA=null, BATTLE=null, curGroup='';
function fmt(n){ n=Number(n||0); return Math.abs(n)>=10000 ? (n/10000).toFixed(2)+'万' : String(n) }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]}) }

function render(){
  var d=DATA; if(!d) return;
  document.getElementById('stamp').textContent = d.time ? ('更新于 '+d.time+' · 成员 '+d.member_count+' 人') : '暂无数据';
  document.getElementById('dot').className='dot'+(d.ok?'':' off');
  var cards=[['同盟成员', d.member_count+' 人'],['总武勋', fmt(d.total_wu)],['平均武勋', fmt(d.avg_wu)],['分组数', d.group_count]];
  document.getElementById('cards').innerHTML=cards.map(function(c){
    return '<div class="card"><div class="k">'+c[0]+'</div><div class="v">'+c[1]+'</div></div>' }).join('');

  var metric=document.getElementById('metric').value;
  var gs=(d.groups||[]).slice().sort(function(a,b){ return metric==='avg' ? b.avg-a.avg : b.total-a.total });
  document.querySelector('#gtable tbody').innerHTML = gs.map(function(g,i){
    return '<tr><td class="num">'+(i+1)+'</td><td><b>'+esc(g.group)+'</b></td><td class="num">'+g.count+
           '</td><td class="num wu">'+fmt(g.total)+'</td><td class="num avg">'+fmt(g.avg)+'</td></tr>' }).join('')
    || '<tr><td colspan="5" class="empty">暂无数据</td></tr>';

  var chips=document.getElementById('groupchips');
  var sig=gs.map(function(g){return g.group+':'+g.count}).join('|');
  if(chips.getAttribute('data-sig')!==sig){
    chips.setAttribute('data-sig',sig);
    chips.innerHTML='<span class="chip'+(curGroup?'':' on')+'" data-g="">全部<b>'+d.member_count+'</b></span>'+
      gs.map(function(g){ return '<span class="chip'+(g.group===curGroup?' on':'')+'" data-g="'+esc(g.group)+'"><b>'+
        esc(g.group)+'</b><span class="n">'+g.count+'</span></span>' }).join('');
  } else {
    Array.prototype.forEach.call(chips.children,function(el){
      el.className='chip'+((el.getAttribute('data-g')||'')===curGroup?' on':'');
    });
  }
  var q=(document.getElementById('msearch').value||'').trim().toLowerCase();
  var ms=(d.members||[]).slice().sort(function(a,b){ return b.wu-a.wu });
  if(curGroup) ms=ms.filter(function(m){ return (m.group||'未分组')===curGroup });
  if(q) ms=ms.filter(function(m){ return String(m.name||'').toLowerCase().indexOf(q)>=0 });
  document.querySelector('#mtable tbody').innerHTML = ms.slice(0,300).map(function(m,i){
    var st=(STATS[m.name]||{});
    return '<tr><td class="num">'+(i+1)+'</td><td><b>'+esc(m.name)+'</b></td><td><span class="tag">'+esc(m.group||'未分组')+
           '</span></td><td class="num">'+m.power+'</td><td class="num wu">'+m.wu+'</td><td class="num">'+(st.battles||0)+
           '</td><td class="num">'+(st.flip||0)+'</td><td class="num">'+(st.demolish||0)+'</td><td class="num avg">'+Math.round(st.score||0)+'</td></tr>' }).join('')
    || '<tr><td colspan="9" class="empty">没有符合条件的成员</td></tr>';
}

var STATS={};
function num(id,def){ var el=document.getElementById(id); var v=el?parseFloat(el.value):NaN; return isNaN(v)?def:v }

var TEAMS=[];
function heroLabel(t,k){ var n=t['hero'+k+'_name']; return n || (t['hero'+k] ? '#'+t['hero'+k] : '—') }
function renderTeams(){
  var q=(document.getElementById('tsearch').value||'').trim().toLowerCase();
  var list=(TEAMS||[]);
  if(q) list=list.filter(function(t){ return String(t.player||'').toLowerCase().indexOf(q)>=0 });
  document.querySelector('#ttable tbody').innerHTML = list.slice(0,200).map(function(t,i){
    return '<tr><td class="num">'+(i+1)+'</td><td><b>'+esc(t.player)+'</b></td>'+
      '<td>'+esc(heroLabel(t,1))+'</td><td>'+esc(heroLabel(t,2))+'</td><td>'+esc(heroLabel(t,3))+'</td>'+
      '<td class="num">'+(t.level||0)+'</td><td class="num">'+(t.star||0)+'</td><td class="num">'+t.battles+'</td>'+
      '<td class="num">'+t.wins+'/'+t.draws+'/'+t.losses+'</td><td class="num">'+(t.win_rate||0)+'%</td>'+
      '<td class="num">'+fmt(t.our_loss)+'</td><td class="num">'+fmt(t.enemy_loss)+'</td>'+
      '<td class="num avg">'+(t.exchange==null?'—':t.exchange.toFixed(2))+'</td></tr>' }).join('')
    || '<tr><td colspan="13" class="empty">没有找到该玩家的队伍</td></tr>';
}
function tickTeams(){
  if(window.__EMBED__){ TEAMS=(window.__EMBED__.teams||[]); renderTeams(); return; }
  fetch('/api/teams',{cache:'no-store'}).then(function(r){return r.json()}).then(function(d){
    TEAMS=d.rows||[]; renderTeams();
  }).catch(function(){});
}

function tick(){
  if(window.__EMBED__){ DATA=window.__EMBED__; render(); return; }
  fetch('/api/data',{cache:'no-store'}).then(function(r){return r.json()}).then(function(d){
    DATA=d; render();
  }).catch(function(){
    document.getElementById('dot').className='dot off';
    document.getElementById('stamp').textContent='连接中断，重试中…';
  });
}
function tickBattle(){
  if(window.__EMBED__) return;
  fetch('/api/battle',{cache:'no-store'}).then(function(r){return r.json()}).then(function(d){
    BATTLE=d; STATS={};
    (d.rows||[]).forEach(function(r){ STATS[r.name]=r });
    render();
  }).catch(function(){});
}
document.getElementById('metric').addEventListener('change', render);
document.getElementById('groupchips').addEventListener('click', function(ev){
  var el=ev.target.closest('.chip'); if(!el) return;
  curGroup=el.getAttribute('data-g')||''; render();
});
document.getElementById('msearch').addEventListener('input', function(){ if(DATA) render() });

var sb=document.getElementById('sharebtn');
if(sb) sb.addEventListener('click', function(ev){
  ev.preventDefault();
  if(sb.dataset.busy) return;
  sb.dataset.busy='1'; sb.textContent='生成中…';
  fetch('/api/share',{method:'POST'}).then(function(r){return r.json()}).then(function(d){
    sb.dataset.busy=''; sb.textContent='生成分享链接';
    var box=document.getElementById('sharebox'); box.style.display='';
    if(d.ok){
      box.innerHTML='<div class="bwrap"><div class="btxt"><div class="btitle">分享链接已生成 · 永久有效</div>'+
        '<div class="url">'+d.url+'</div><div class="tip">刚生成时页面要 30~60 秒才可访问；发到群里任何人点开都能看，你电脑关着也行。</div></div>'+
        (d.qr?'<img class="qr" src="'+d.qr+'">':'')+'</div>';
    } else {
      box.innerHTML='<div class="bwrap"><div class="btxt"><div class="btitle">生成失败</div><div class="tip">'+esc(d.msg)+'</div></div></div>';
    }
  }).catch(function(e){
    sb.dataset.busy=''; sb.textContent='生成分享链接';
    var box=document.getElementById('sharebox'); box.style.display='';
    box.innerHTML='<div class="bwrap"><div class="btxt"><div class="btitle">生成失败</div><div class="tip">'+esc(e)+'</div></div></div>';
  });
});

tick(); if(!window.__EMBED__) setInterval(tick, 5000);
tickBattle(); if(!window.__EMBED__) setInterval(tickBattle, 15000);
tickTeams(); if(!window.__EMBED__) setInterval(tickTeams, 15000);
var ts=document.getElementById('tsearch'); if(ts) ts.addEventListener('input', renderTeams);
if(window.__EMBED__){
  var a=document.getElementById('sharebtn'); if(a) a.style.display='none';
  var b=document.querySelector('a[href="/export"]'); if(b) b.style.display='none';
}
</script>
</body></html>
